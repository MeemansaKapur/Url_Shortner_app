# Local stack + benchmark harness.
#   docker compose up -d --build                      # app (postgres backend, cache on) + all stores
#   STORAGE=mongo CACHE=false docker compose up -d app  # switch configuration
# Every service has fixed CPU/memory limits so MongoDB vs PostgreSQL runs are comparable.
services:
  app:
    build: .
    environment:
      STORAGE: ${STORAGE:-postgres}
      CACHE: ${CACHE:-true}
      VIRTUAL_THREADS: ${VIRTUAL_THREADS:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      REDIS_HOST: redis
      MONGO_URI: mongodb://mongo:27017
      PG_URL: jdbc:postgresql://postgres:5432/urlshortener
      PG_USER: shortener
      PG_PASSWORD: secret
    ports:
      - "8080:8080"
    cpus: "2"
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  redis:
    image: redis:7
    # Pure cache: bounded memory, evict least-recently-used keys, no persistence (rebuildable from the DB)
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    cpus: "1"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: secret
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    cpus: "2"
    mem_limit: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d urlshortener"]
      interval: 2s
      timeout: 2s
      retries: 30

  mongo:
    image: mongo:8.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    cpus: "2"
    mem_limit: 1g
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Load generator on the same Docker network (hits app:8080 directly). Only started by the benchmark script.
  k6:
    image: grafana/k6:1.0.0
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts:ro
      - ./results:/results

volumes:
  pgdata:
  mongodata:
