spring.application.name=url-shortener
server.port=8080
# Trust X-Forwarded-* from the reverse proxy (Caddy) so shortUrl uses https://<public host>
server.forward-headers-strategy=framework

# Java 21 virtual threads for request handling (VIRTUAL_THREADS=false gives the platform-thread baseline)
spring.threads.virtual.enabled=${VIRTUAL_THREADS:true}

# ---- Application ----
# STORAGE = postgres | mongo      CACHE = true | false
app.storage=${STORAGE:postgres}
app.code-length=7
app.admin-token=${ADMIN_TOKEN:}

app.cache.enabled=${CACHE:true}
app.cache.max-ttl=24h
app.cache.negative-ttl=60s

# Token bucket per API key on POST /api/links: burst of 20, refill 5 tokens/s
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:20}
app.rate-limit.refill-per-second=${RATE_LIMIT_REFILL:5}

app.mongo.uri=${MONGO_URI:mongodb://localhost:27017}
app.mongo.database=${MONGO_DB:urlshortener}
app.mongo.max-pool-size=${MONGO_POOL:100}

app.postgres.url=${PG_URL:jdbc:postgresql://localhost:5432/urlshortener}
app.postgres.username=${PG_USER:shortener}
app.postgres.password=${PG_PASSWORD:secret}
app.postgres.max-pool-size=${PG_POOL:100}

# ---- Redis ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Short timeouts: if Redis is slow or down, fall back to the database instead of hanging
spring.data.redis.timeout=50ms
spring.data.redis.connect-timeout=200ms

# ---- Actuator / metrics ----
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
